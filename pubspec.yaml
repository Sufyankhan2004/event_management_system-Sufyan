name: event_semester_sufyan
description: A Flutter project for Event Management System (Semester Project)
publish_to: 'none' # since this is not for pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.3
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  image_picker: ^1.0.9
  intl: ^0.20.2
  cached_network_image: ^3.3.2
  shimmer: ^3.0.0
  uuid: ^4.5.1
  flutter_rating_bar: ^4.0.1
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
